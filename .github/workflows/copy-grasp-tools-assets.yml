name: Copy Grasp-Tools assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CROG-NPU
        uses: actions/checkout@v4
        with:
          path: crog

      - name: Check out ToolRGSNPU
        uses: actions/checkout@v4
        with:
          repository: mengyuanuom/ToolRGSNPU
          ref: main
          path: toolrgs
          persist-credentials: false

      - name: Copy and commit assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crog/datasets/grasp-tools/source
          cp -a toolrgs/assets/grasp_tools/. crog/datasets/grasp-tools/source/
          cd crog
          test "$(find datasets/grasp-tools/source -type f | wc -l)" -eq 257
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f datasets/grasp-tools/source
          git diff --cached --check
          git commit -m "Copy Grasp-Tools assets from ToolRGSNPU"
          git push origin HEAD:main