DATA:
  dataset: OCID-VLG
  root_path: ./datasets/OCID-VLG
  with_depth: False
  train_split: train
  val_split: val
  offset_r: 20
  offset_sigma:
MODEL:
  architecture: grconvnetclip
TRAIN:
  clip_pretrain: pretrain/RN50.pt
  version: multiple
  input_channels: 3
  input_size: 416
  word_len: 17
  word_dim: 1024
  dropout: False
  dropout_prob: 0.0
  amp: False
  sync_bn: False
  optimizer: adam
  pin_memory: False

  workers: 4  # per process; 32 workers total with eight NPUs
  workers_val: 2
  epochs: 50
  milestones: [35]
  start_epoch: 0
  batch_size: 24  # global batch size
  batch_size_val: 24  # global validation batch size
  base_lr: 0.0001
  lr_decay: 0.1
  lr_multi: 0.1
  weight_decay: 0.0
  max_norm: 0.0
  manual_seed: 0
  print_freq: 100
  exp_name: grconvnetclip_ocid_vlg_8npu
  output_folder: exp/ocid_vlg
  save_freq: 1
  val_freq: 5
  weight:
  resume:
  evaluate: True
  use_pretrained_clip: True
  use_grasp_masks: True
Distributed:
  dist_url: env://
  dist_backend: hccl
  multiprocessing_distributed: True
  world_size: 1
  rank: 0
TEST:
  test_split: test
  evaluation_protocol: crog_legacy
  visualize: False

